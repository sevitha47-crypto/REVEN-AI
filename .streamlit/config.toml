[server]
port = 3000
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
allowedHosts = ["*"]
corsAllowedOrigins = ["*"]
maxUploadSize = 200

[client]
allowedOrigins = ["*"]

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#F97316"
backgroundColor = "#0A0F1D"
secondaryBackgroundColor = "#111C33"
textColor = "#F8FAFC"
font = "sans serif"
